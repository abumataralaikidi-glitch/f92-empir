name: F-92 Sovereign Empire - Ultimate Master APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ultimate-empire-app:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Sovereign Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Compile All Sovereign Rooms & Engines
      run: |
        echo "=================================================="
        echo "Building F-92 Sovereign Empire for Commander: Salah El-Din Sami (Al-Arrab)"
        echo "Integrating all core engines, security protocols, and rooms..."
        echo "=================================================="
        mkdir -p final_sovereign_app_release
        cp *.py final_sovereign_app_release/
        echo "All rooms compiled successfully into sovereign package."

    - name: Package Sovereign Master App
      run: |
        cd final_sovereign_app_release
        zip -r ../F92_Sovereign_Empire_Ultimate_App.zip *
        cd ..
        echo "Master Application Package is completely ready."

    - name: Upload Master Application Artifact
      uses: actions/upload-artifact@v4
      with:
        name: F92-Sovereign-Master-App-Package
        path: F92_Sovereign_Empire_Ultimate_App.zip
